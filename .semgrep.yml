rules:
  - id: raw-sql-string-concat
    patterns:
      - pattern: $DB.execute("..." + $VAR)
      - pattern: $DB.execute(f"...{$VAR}...")
    message: >
      SQL injection risk: use parameterised queries conn.execute("... WHERE x = ?", (val,))
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"

  - id: hardcoded-password-assignment
    pattern: $VAR = "$PASSWORD"
    metavariable-regex:
      metavariable: $VAR
      regex: '.*(password|passwd|secret|token|key|api_key).*'
    message: >
      Hardcoded credential in '$VAR'. Use os.environ.get() instead.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021"

  - id: flask-debug-true
    pattern: app.run(..., debug=True, ...)
    message: >
      Flask debug=True must never run in production — exposes an interactive debugger.
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-94"

  - id: subprocess-shell-true
    pattern: subprocess.run(..., shell=True, ...)
    message: >
      shell=True with subprocess is a command injection risk if input is user-controlled.
    languages: [python]
    severity: WARNING
    metadata:
      cwe: "CWE-78"