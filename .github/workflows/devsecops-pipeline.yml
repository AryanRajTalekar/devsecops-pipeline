name: DevSecOps Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: devsecops-demo-app

jobs:

# ── Stage 1: Secret Scanning ───────────────────────────────────────────────────
  secret-scan:
    name: "Stage 1 — Secret Scanning (TruffleHog)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          head: HEAD
          extra_args: --only-verified

# ── Stage 2: SAST ─────────────────────────────────────────────────────────────
  sast-semgrep:
    name: "Stage 2 — SAST (Semgrep)"
    runs-on: ubuntu-latest
    needs: secret-scan
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >
            p/python
            p/flask
            p/owasp-top-ten
            p/sql-injection
            p/xss
            .semgrep.yml
          generateSarif: "1"
        env:
          SEMGREP_TIMEOUT: 300

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

# ── Stage 3: Dependency Scanning ──────────────────────────────────────────────
  dependency-scan:
    name: "Stage 3 — Dependency Scanning"
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit \
            --requirement app/requirements.txt \
            --format json \
            --output pip-audit-results.json \
            --strict \
            || (cat pip-audit-results.json && exit 1)

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "devsecops-demo"
          path: "."
          # Passing formats on separate lines satisfies the action wrapper parser
          format: |
            HTML
            JSON
          out: "reports/dependency-check"
          args: >
            --noupdate
            --enableRetired
            --failOnCVSS 7
            --suppression dependency-check-suppressions.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/dependency-check/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit-results.json



# ── Stage 4: Unit + Security Tests ────────────────────────────────────────────
  unit-tests:
    name: "Stage 4 — Unit & Security Tests (pytest)"
    runs-on: ubuntu-latest
    needs: [sast-semgrep, dependency-scan]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: |
          pip install -r app/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          cd app
          pytest ../tests/ \
            --cov=app \
            --cov-report=xml:../reports/coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -v

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: reports/coverage.xml

# ── Stage 5: Container Scanning ───────────────────────────────────────────────
  container-scan:
    name: "Stage 5 — Container Scanning (Trivy + Hadolint)"
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint — Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning
          format: sarif
          output-file: hadolint.sarif
          no-fail: true

      - name: Upload Hadolint scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint.sarif
          category: hadolint

      - name: Build Docker image
        run: |
          docker build \
            --tag "devsecops-demo:${{ github.sha }}" \
            --tag "devsecops-demo:latest" \
            app/

      - name: Trivy — image scan
        uses: aquasecurity/trivy-action@v0.20.0 # <-- Switched from @master to a stable version tag
        with:
          image-ref: "devsecops-demo:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: hashFiles('trivy-results.sarif') != '' # <-- Only runs if the file actually exists!
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Save image artifact
        run: docker save "devsecops-demo:latest" | gzip > image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1

# ── Stage 6: DAST ─────────────────────────────────────────────────────────────
  dast-zap:
    name: "Stage 6 — DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: container-scan
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app dependencies
        run: pip install -r app/requirements.txt

      - name: Start app directly on runner
        run: |
          cd app
          FLASK_SECRET_KEY=stagingsecret123 \
          DB_PATH=/tmp/zap-test.db \
          gunicorn --bind 0.0.0.0:5000 --workers 1 --timeout 60 --daemon \
            --log-file /tmp/gunicorn.log \
            app:app

          echo "Waiting for app to be healthy..."
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/health > /dev/null; then
              echo "App is healthy after ${i}s"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "App never became healthy. Gunicorn logs:"
              cat /tmp/gunicorn.log
              exit 1
            fi
            sleep 2
          done

      - name: OWASP ZAP full scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: "http://127.0.0.1:5000"
          rules_file_name: ".zap-rules.tsv"
          cmd_options: "-a"
          allow_issue_writing: false
          fail_action: false

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-full-report
          path: |
            report_html.html
            report_json.json
            report_md.md

      - name: Stop app
        if: always()
        run: pkill gunicorn 2>/dev/null || true

# ── Stage 7: Security Summary ──────────────────────────────────────────────────
  security-summary:
    name: "Stage 7 — Security Summary Report"
    runs-on: ubuntu-latest
    needs: [secret-scan, sast-semgrep, dependency-scan, unit-tests, container-scan, dast-zap]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: all-reports/

      - name: Generate report
        run: |
          python scripts/generate_report.py \
            --reports-dir all-reports/ \
            --output reports/security-summary.md \
            --sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}"

      - name: Post to GitHub Step Summary
        run: cat reports/security-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: reports/security-summary.md

      - uses: actions/upload-artifact@v4
        with:
          name: security-summary
          path: reports/security-summary.md

# ── Stage 8: Deploy ───────────────────────────────────────────────────────────
  deploy:
    name: "Stage 8 — Deploy to Render"
    runs-on: ubuntu-latest
    needs: [dast-zap, security-summary]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy-status.outputs.app_url }} # <-- Fixes the error by reading from step output instead
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -sf -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deploy triggered"

      - name: Wait and verify health
        id: deploy-status # <-- ID allows the environment block above to read this step's output safely
        run: |
          echo "Waiting 60s for Render to deploy..."
          sleep 60
          curl -sf "${{ secrets.RENDER_APP_URL }}/health" \
            || (echo "Production health check failed" && exit 1)
          echo "Production is healthy"
          echo "app_url=${{ secrets.RENDER_APP_URL }}" >> $GITHUB_OUTPUT