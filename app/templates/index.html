<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SecureShop — DevSecOps Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #1a1a1a; }
    header {
      background: #1a1a2e; color: #fff; padding: 1rem 2rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 1.4rem; font-weight: 600; }
    .badge {
      background: #00b894; color: #fff; font-size: 11px;
      padding: 3px 10px; border-radius: 20px; font-weight: 600;
    }
    main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    .search-bar { display: flex; gap: 8px; margin-bottom: 1.5rem; }
    .search-bar input {
      flex: 1; padding: 10px 14px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 15px;
    }
    .search-bar button {
      padding: 10px 20px; background: #1a1a2e; color: #fff;
      border: none; border-radius: 8px; cursor: pointer; font-size: 15px;
    }
    .search-bar button:hover { background: #2d2d5e; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
    }
    .card {
      background: #fff; border-radius: 10px; padding: 1.2rem;
      box-shadow: 0 1px 4px rgba(0,0,0,.08); border: 1px solid #eee;
    }
    .card h3 { font-size: 1rem; margin-bottom: 6px; }
    .card .cat { font-size: 12px; color: #888; margin-bottom: 10px; }
    .card .price { font-size: 1.3rem; font-weight: 700; color: #1a1a2e; }
    .status {
      margin-top: 2rem; padding: 1rem 1.2rem;
      background: #fff; border-radius: 10px;
      border-left: 4px solid #00b894; font-size: 13px; color: #555;
    }
    footer {
      text-align: center; padding: 2rem; color: #aaa;
      font-size: 12px; margin-top: 3rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>SecureShop</h1>
    <span class="badge">DevSecOps Pipeline Demo</span>
  </header>

  <main>
    <div class="search-bar">
      <input id="q" type="text" placeholder="Search products..." />
      <button onclick="search()">Search</button>
    </div>
    <div class="grid" id="grid">Loading...</div>
    <div class="status" id="status"></div>
  </main>

  <footer>
    Built with a fully automated DevSecOps pipeline —
    TruffleHog · Semgrep · OWASP Dependency-Check · Trivy · OWASP ZAP
  </footer>

  <script>
    async function search() {
      const q   = document.getElementById('q').value;
      const url = '/api/products' + (q ? '?search=' + encodeURIComponent(q) : '');
      const res = await fetch(url);
      const data = await res.json();
      const grid = document.getElementById('grid');
      if (!data.length) { grid.innerHTML = '<p>No products found.</p>'; return; }
      grid.innerHTML = data.map(p => `
        <div class="card">
          <h3>${esc(p.name)}</h3>
          <div class="cat">${esc(p.category)}</div>
          <div class="price">$${p.price.toFixed(2)}</div>
        </div>
      `).join('');
      document.getElementById('status').textContent =
        `${data.length} product(s) returned. All inputs sanitised server-side.`;
    }
    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    search();
  </script>
</body>
</html>
