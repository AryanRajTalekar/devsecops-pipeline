# render.yaml — Free deployment on Render.com
services:
  - type: web
    name: devsecops-demo
    runtime: python
    plan: free
    region: oregon

    # Install from the app/ subfolder
    buildCommand: "pip install -r app/requirements.txt"

    # cd into app/ so gunicorn can find app.py
    startCommand: "cd app && gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 60 app:app"

    healthCheckPath: /health

    envVars:
      - key: DB_PATH
        value: "/tmp/devsecops.db"
      - key: FLASK_SECRET_KEY
        sync: false